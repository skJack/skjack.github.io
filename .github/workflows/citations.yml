name: Update citations

on:
  schedule:
    - cron: "17 2 * * 1"  # Mondays 02:17 UTC (10:17 in Singapore)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/citations.yml
      - .github/scripts/update_citations.py

permissions:
  contents: write

concurrency:
  group: citations

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Google Scholar counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/update_citations.py
